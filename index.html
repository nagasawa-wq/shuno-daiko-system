<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>収納代行 管理システム</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root {
  --bg: #eef0f4;
  --surface: #fff;
  --border: #d0d5dd;
  --navy: #1b3a6b;
  --navy2: #254e9a;
  --text: #1a1a1a;
  --muted: #6b7280;
  --green: #16a34a;
  --red: #dc2626;
  --orange: #d97706;
  --row-alt: #f7f8fa;
  color-scheme: light;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: 'Noto Sans JP', sans-serif; background: var(--bg); color: var(--text); font-size: 13px; line-height: 1.5; }

/* Header */
.header { background: var(--navy); color: #fff; padding: 10px 20px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
.header h1 { font-size: 15px; font-weight: 700; white-space: nowrap; }
.header-spacer { flex: 1; }
.header label { font-size: 11px; opacity: .8; }
.header input[type="month"] { background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.3); color: #fff; padding: 4px 10px; border-radius: 4px; font-family: inherit; font-size: 13px; }
.header input[type="month"]::-webkit-calendar-picker-indicator { filter: invert(1); }
.header-note { font-size: 11px; opacity: .6; }

/* Tabs */
.tabs { display: flex; background: #fff; border-bottom: 2px solid var(--navy); overflow-x: auto; }
.tab-btn { padding: 10px 22px; font-family: inherit; font-size: 13px; font-weight: 500; background: none; border: none; cursor: pointer; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -2px; white-space: nowrap; }
.tab-btn.active { color: var(--navy); border-bottom-color: var(--navy); font-weight: 700; }
.tab-btn:hover:not(.active) { color: var(--navy2); background: #f0f4ff; }

.main { padding: 16px; }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* Group block */
.group-block { background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--navy); border-radius: 6px; margin-bottom: 16px; overflow: hidden; }
.group-block.self-group { border-left-color: var(--orange); }
.group-header { background: var(--navy); color: #fff; padding: 8px 16px; font-size: 13px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
.group-header.self-header { background: var(--orange); }
.subgroup-header { background: #e8edf5; padding: 6px 16px; font-size: 12px; font-weight: 700; color: var(--navy); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
.subgroup-header.self-sub { background: #fef3c7; color: var(--orange); }

/* Data table */
.data-table { width: 100%; table-layout: fixed; border-collapse: collapse; font-size: 12px; }
.data-table th { background: #f0f4ff; border: 1px solid #c8d5e8; padding: 6px 8px; text-align: center; font-size: 11px; font-weight: 700; white-space: normal; word-break: break-word; }
.data-table td { border: 1px solid #dde3ec; padding: 4px 6px; }
.data-table td.site-name { font-weight: 500; white-space: nowrap; min-width: 100px; padding: 4px 12px; }
.data-table td.total-cell { font-weight: 700; background: #f0f4ff; text-align: right; white-space: nowrap; }
.data-table tr:nth-child(even) { background: var(--row-alt); }
.data-table tr:hover { background: #eef3ff; }
.data-table tr.subtotal-row { background: #dce6f5 !important; font-weight: 700; }
.data-table tr.subtotal-row td { border-color: #c8d5e8; }
.num-input { font-family: inherit; font-size: 12px; text-align: right; border: 1px solid #c8d5e8; border-radius: 3px; padding: 3px 6px; width: 100%; background: #fff; color: var(--text); }
.num-input:focus { outline: 2px solid var(--navy2); border-color: var(--navy2); }
.num-input::-webkit-inner-spin-button { -webkit-appearance: none; }

/* PDF Upload Tab */
.pdf-drop-zone { border: 3px dashed var(--border); border-radius: 10px; padding: 48px; text-align: center; cursor: pointer; transition: all .2s; background: var(--surface); margin-bottom: 16px; }
.pdf-drop-zone:hover, .pdf-drop-zone.drag-over { border-color: var(--navy); background: #f0f4ff; }
.pdf-drop-zone .drop-icon { font-size: 48px; margin-bottom: 12px; }
.pdf-drop-zone h3 { font-size: 16px; color: var(--navy); margin-bottom: 8px; }
.pdf-drop-zone p { font-size: 12px; color: var(--muted); }
#pdfFileInput { display: none; }

.pdf-results { display: flex; flex-direction: column; gap: 12px; }
.pdf-card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.pdf-card-header { background: #f5f7fb; padding: 10px 16px; font-size: 12px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
.pdf-card-body { padding: 14px 16px; }
.detected-amounts { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.amount-chip { background: #e8f0fe; border: 1px solid #93b4f5; border-radius: 20px; padding: 4px 12px; font-size: 12px; cursor: pointer; font-weight: 500; transition: all .15s; }
.amount-chip:hover { background: var(--navy); color: #fff; border-color: var(--navy); }
.amount-chip.selected { background: var(--navy); color: #fff; border-color: var(--navy); }
.assign-panel { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; border-top: 1px solid #eee; padding-top: 12px; }
.assign-panel select, .assign-panel input { font-family: inherit; font-size: 12px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 4px; background: #fff; color: var(--text); }
.assign-panel select { min-width: 160px; }
.assign-panel input { width: 130px; text-align: right; }
.btn-assign { padding: 7px 16px; background: var(--green); color: #fff; border: none; border-radius: 4px; font-family: inherit; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.btn-assign:hover { opacity: .85; }
.btn-sm { padding: 4px 12px; background: var(--navy); color: #fff; border: none; border-radius: 4px; font-family: inherit; font-size: 11px; cursor: pointer; }
.btn-sm:hover { opacity: .85; }
.btn-sm.danger { background: var(--red); }
.pdf-status { font-size: 11px; color: var(--muted); padding: 6px 0; }
.assigned-list { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
.assigned-item { font-size: 11px; background: #f0fdf4; border: 1px solid #86efac; border-radius: 4px; padding: 4px 10px; display: flex; justify-content: space-between; align-items: center; }

/* Summary Tab */
.summary-grid { display: grid; grid-template-columns: repeat(auto-fill, 340px); gap: 16px; margin-bottom: 16px; justify-content: start; }
.summary-card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.summary-card-header { background: var(--navy); color: #fff; padding: 8px 16px; font-size: 12px; font-weight: 700; display: flex; justify-content: space-between; }
.summary-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.summary-table tr td:first-child { padding: 7px 14px; color: var(--muted); }
.summary-table tr td:last-child { padding: 7px 16px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 500; white-space: nowrap; }
.summary-table tr { border-bottom: 1px solid #eee; }
.summary-table tr.hl td { background: #fff3cd; font-weight: 700; }
.summary-table tr.hl td:last-child { color: var(--navy); font-size: 13px; }
.summary-table tr.last-row td { background: #e8f5e9; }
.summary-table tr.last-row td:last-child { color: var(--green); font-size: 14px; font-weight: 700; }

.self-summary-card { background: var(--surface); border: 1px solid #fed7aa; border-radius: 6px; overflow: hidden; margin-bottom: 16px; }
.self-summary-header { background: var(--orange); color: #fff; padding: 10px 16px; font-size: 13px; font-weight: 700; }
.self-summary-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.self-summary-table th { background: #fef3c7; border: 1px solid #fed7aa; padding: 6px 12px; font-size: 11px; text-align: center; }
.self-summary-table td { border: 1px solid #fed7aa; padding: 6px 12px; font-variant-numeric: tabular-nums; }
.self-summary-table td.num { text-align: right; }
.self-summary-table tr.total-row { background: #fef3c7; font-weight: 700; }

.big-total-bar { background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--green); border-radius: 6px; padding: 14px 20px; margin-bottom: 16px; display: flex; gap: 40px; flex-wrap: wrap; align-items: center; }
.big-total-item { text-align: center; }
.big-total-label { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
.big-total-val { font-size: 18px; font-weight: 700; }
.big-total-val.green { color: var(--green); }
.big-total-val.red { color: var(--red); }

.section-divider { font-size: 13px; font-weight: 700; color: var(--navy); border-bottom: 2px solid var(--navy); padding-bottom: 6px; margin: 20px 0 12px; }
.section-divider.orange { color: var(--orange); border-bottom-color: var(--orange); }

/* Invoice Tab */
.inv-controls { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 14px 18px; margin-bottom: 16px; display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; }
.inv-controls .field label { font-size: 11px; color: var(--muted); display: block; margin-bottom: 4px; }
.inv-controls select, .inv-controls input { font-family: inherit; font-size: 12px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 4px; background: var(--surface); color: var(--text); }
.inv-controls select { min-width: 220px; }
.print-btn { padding: 8px 20px; background: var(--navy); color: #fff; border: none; border-radius: 4px; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.print-btn:hover { background: var(--navy2); }
.all-invoices { display: flex; flex-direction: column; gap: 24px; }
.inv-group-label { font-size: 12px; font-weight: 700; color: var(--navy); border-bottom: 2px solid var(--navy); padding-bottom: 6px; margin-bottom: 10px; }

/* Invoice Document */
.invoice { background: #fff; color: #111; border: 1px solid #bbb; padding: 36px 44px; font-family: 'Noto Sans JP', sans-serif; font-size: 11.5px; line-height: 1.65; max-width: 820px; }
.inv-bank { width: 100%; border-collapse: collapse; margin-top: 28px; }
.inv-bank caption { text-align: center; font-weight: 700; font-size: 12px; border: 1px solid #888; border-bottom: none; padding: 5px; background: #f5f5f5; }
.inv-bank td { border: 1px solid #888; padding: 4px 10px; }
.inv-bank td:first-child { width: 120px; background: #f5f5f5; font-weight: 600; }
.inv-bank-multi { margin-top: 28px; }
.inv-bank-multi .inv-bank { margin-top: 0; }
.inv-bank-multi .inv-bank + .inv-bank { margin-top: 8px; }
.inv-top { display: grid; grid-template-columns: 1fr auto; gap: 16px; margin-bottom: 20px; }
.inv-date-box { background: #fff9c4; border: 1px solid #e0d96a; padding: 3px 14px; font-size: 11.5px; text-align: right; white-space: nowrap; }
.inv-recipient { font-size: 11px; line-height: 1.8; }
.inv-recipient-name { font-size: 15px; font-weight: 700; margin-top: 4px; }
.inv-issuer { text-align: right; font-size: 11px; line-height: 1.8; margin-top: 10px; }
.inv-issuer-name { font-size: 13px; font-weight: 700; }
.inv-title { text-align: center; font-size: 20px; font-weight: 700; margin: 18px 0 10px; letter-spacing: .05em; }
.inv-note { font-size: 10.5px; margin-bottom: 14px; }
.inv-period-row { margin-bottom: 14px; }
.inv-period-label { font-size: 10.5px; margin-right: 6px; }
.inv-period-val { background: #fff9c4; border: 1px solid #e0d96a; padding: 3px 14px; font-size: 11px; }
.inv-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
.inv-table th { background: #dce3ed; border: 1px solid #999; padding: 5px 10px; font-size: 10.5px; font-weight: 700; text-align: center; }
.inv-table td { border: 1px solid #999; padding: 5px 10px; font-size: 11px; }
.inv-table td.n { text-align: center; width: 26px; }
.inv-table td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 110px; }
.inv-table td.biko { text-align: center; min-width: 50px; }
.inv-table tr.sub td { background: #f0f0f0; font-weight: 700; }
.inv-summary { width: 100%; border-collapse: collapse; }
.inv-summary th { background: #dce3ed; border: 1px solid #999; padding: 5px 10px; font-size: 10.5px; font-weight: 700; text-align: center; }
.inv-summary td { border: 1px solid #999; padding: 6px 10px; font-size: 11px; font-variant-numeric: tabular-nums; }
.inv-summary td.num { text-align: right; }

@media print {
  .header, .tabs, .inv-controls, .inv-group-label, .print-btn, .section-divider,
  #tab-entry, #tab-pdf, #tab-summary, #tab-summarySelf { display: none !important; }
  #tab-invoice { display: block !important; }
  .main { padding: 0; }
  .invoice { border: none; padding: 20px; max-width: 100%; }
  .all-invoices { gap: 0; }
  body { background: #fff; }
  /* 背景色・枠線を印刷時も画面と同じに保つ */
  .invoice, .invoice * {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  /* 1枚印刷モード：print-targetだけ表示 */
  body.print-one .inv-wrap { display: none !important; }
  body.print-one .inv-wrap.print-target { display: block !important; }
  body.print-one .invoice { page-break-after: avoid; }
  /* 全件印刷モード */
  body:not(.print-one) .inv-wrap { page-break-after: always; }
  body:not(.print-one) .inv-wrap:last-child { page-break-after: avoid; }
}
</style>
</head>
<body>

<div class="header">
  <h1>収納代行 管理システム</h1>
  <div class="header-spacer"></div>
  <div style="display:flex;align-items:center;gap:8px">
    <label>対象年月：</label>
    <input type="month" id="globalMonth" value="2026-07" onchange="onMonthChange()">
  </div>
  <div class="header-note" id="syncStatus">接続中…</div>
  <button onclick="downloadSource()" style="background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);color:#fff;padding:5px 13px;border-radius:4px;font-family:inherit;font-size:12px;cursor:pointer;white-space:nowrap" onmouseover="this.style.background='rgba(255,255,255,.28)'" onmouseout="this.style.background='rgba(255,255,255,.15)'">⬇ ソースDL</button>
</div>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('entry',this)">① データ入力</button>
  <button class="tab-btn" onclick="switchTab('pdf',this)">② PDFアップロード</button>
  <button class="tab-btn" onclick="switchTab('summary',this)">③ 集計表（請求分）</button>
  <button class="tab-btn" onclick="switchTab('summarySelf',this)">④ 集計表（自社分）</button>
  <button class="tab-btn" onclick="switchTab('invoice',this)">⑤ 請求書</button>
  <button class="tab-btn" onclick="switchTab('jiwake',this)">⑥ 仕訳変換</button>
</div>

<div class="main">

  <!-- Tab 1: Data Entry -->
  <div id="tab-entry" class="tab-panel active">
    <div id="entryContent"></div>
  </div>

  <!-- Tab 2: PDF Upload -->
  <div id="tab-pdf" class="tab-panel">
    <div class="pdf-drop-zone" id="dropZone" onclick="document.getElementById('pdfFileInput').click()" ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event)">
      <div class="drop-icon">📄</div>
      <h3>PDFをここにドラッグ＆ドロップ</h3>
      <p>またはクリックしてファイルを選択（複数選択可）</p>
    </div>
    <input type="file" id="pdfFileInput" accept=".pdf" multiple onchange="onFileSelect(event)">
    <div id="pdfSessionArea" style="display:none;margin-bottom:20px">
      <div style="font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px;border-bottom:1px solid var(--border);padding-bottom:6px">今回のアップロード</div>
      <div id="pdfResults" class="pdf-results"></div>
    </div>
    <div id="pdfHistoryArea">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;border-bottom:1px solid var(--border);padding-bottom:6px">
        <span style="font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase">保存済み履歴</span>
        <span id="pdfHistoryCount" style="background:var(--navy);color:#fff;font-size:10px;font-weight:700;padding:1px 7px;border-radius:10px"></span>
      </div>
      <div id="pdfHistoryList"><p style="color:var(--muted);font-size:12px">読込中…</p></div>
    </div>
  </div>

  <!-- Tab 3: Summary (billing) -->
  <div id="tab-summary" class="tab-panel">
    <div id="summaryContent"></div>
  </div>

  <!-- Tab 4: Summary (self) -->
  <div id="tab-summarySelf" class="tab-panel">
    <div id="summarySelfContent"></div>
  </div>

  <!-- Tab 5: Invoice -->
  <div id="tab-invoice" class="tab-panel">
    <div class="inv-controls">
      <div class="field">
        <label>請求書を選択</label>
        <select id="invSelect" onchange="renderInvoices()">
          <option value="all-12">全件一覧（14枚）</option>
          <option value="all">リミット銀振以外（9枚）</option>
        </select>
      </div>
      <div class="field">
        <label>発行日</label>
        <input type="date" id="issueDate" value="2026-08-01" onchange="renderInvoices()">
      </div>
      <div class="field">
        <label>手数料率（%）</label>
        <input type="number" id="feeRate" value="4" step="0.1" style="width:80px" onchange="renderInvoices()">
      </div>
    </div>
    <div id="invoiceContent"></div>
  </div>

  <!-- Tab 6: 仕訳変換 -->
  <div id="tab-jiwake" class="tab-panel">
    <iframe src="jiwake.html" style="width:100%; height:calc(100vh - 120px); border:none; display:block;"></iframe>
  </div>

  <!-- (旧Tab6 robopay srcdoc start) -->
  <div id="tab-robopay-old" style="display:none">
    <iframe style="width:100%; height:calc(100vh - 120px); border:none; display:block;" srcdoc="<!doctype html><html><head><meta charset=utf8><meta name=viewport content=&quot;width=device-width,initial-scale=1,viewport-fit=cover&quot;><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ロボペイ仕訳変換</title>

<style>
:root {
  --bg:       #f0ede8;
  --surface:  #ffffff;
  --surface2: #f7f5f2;
  --border:   #ddd9d2;
  --accent:   #a06818;
  --accent-l: #f5e8cf;
  --fg:       #1a1714;
  --muted:    #7a7268;
  --ok:       #1c7a4a;
  --ok-bg:    #e4f5ec;
  --ng:       #aa2020;
  --ng-bg:    #fce8e8;
  --r:        6px;
  --mono:     'IBM Plex Mono', 'Courier New', monospace;
  --sans:     'Noto Sans JP', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme=&quot;light&quot;]) {
    --bg:       #10100f;
    --surface:  #1a1a1f;
    --surface2: #222228;
    --border:   #30303c;
    --accent:   #e8b840;
    --accent-l: #2a2008;
    --fg:       #eeeef5;
    --muted:    #8080a0;
    --ok:       #48d880;
    --ok-bg:    #0d2e1a;
    --ng:       #f07070;
    --ng-bg:    #2e0d0d;
    color-scheme: dark;
  }
}
:root[data-theme=&quot;dark&quot;] {
  --bg:       #10100f;
  --surface:  #1a1a1f;
  --surface2: #222228;
  --border:   #30303c;
  --accent:   #e8b840;
  --accent-l: #2a2008;
  --fg:       #eeeef5;
  --muted:    #8080a0;
  --ok:       #48d880;
  --ok-bg:    #0d2e1a;
  --ng:       #f07070;
  --ng-bg:    #2e0d0d;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.6;
  padding-inline: 16px;
  padding-block: 24px;
  max-width: 900px;
  margin-inline: auto;
}

.app-header {
  display: flex;
  align-items: baseline;
  gap: 12px;
  margin-bottom: 24px;
  border-bottom: 2px solid var(--accent);
  padding-bottom: 12px;
}
.app-header h1 {
  font-size: 1.25rem;
  font-weight: 700;
  margin: 0;
  color: var(--accent);
}
.app-header p { margin: 0; color: var(--muted); font-size: 0.82rem; }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 20px;
  margin-bottom: 16px;
}
.card-title {

function stemToSite(stem) {
  for (const sfx of ['_銀振','_クレカ','_visamas']) {
    if (stem.endsWith(sfx)) stem = stem.slice(0, -sfx.length);
  }

}

function parseAmount(s) {
  s = String(s).trim();
  const neg = /^[▲△−\-]/.test(s);
  const n = parseInt(s.replace(/[^\d]/g, '') || '0', 10);
  return neg ? -n : n;
}

function lastDay(yr, mo) {

function csvEsc(s) {
  s = String(s ?? '');

    ? '&quot;' + s.replace(/&quot;/g, '&quot;&quot;') + '&quot;'
    : s;
}
function rowToCsv(row) { return row.map(csvEsc).join(','); }

// ─────────────────────────────────────────────────
//  PDF テキスト抽出 (PDF.js)

function itemsToText(items) {
  if (!items.length) return '';
  const sorted = [...items].sort((a, b) => b.transform[5] - a.transform[5]);
  const lines = [];
  let group = [sorted[0]];
  let baseY = sorted[0].transform[5];
  for (let i = 1; i < sorted.length; i++) {
    const item = sorted[i];
    if (Math.abs(item.transform[5] - baseY) <= 8) {
      group.push(item);
    } else {
      const lineStr = group.sort((a, b) => a.transform[4] - b.transform[4])
        .map(x => x.str.trim()).filter(Boolean).join(' ');
      if (lineStr) lines.push(lineStr);
      group = [item];
      baseY = item.transform[5];
    }
  }
  if (group.length) {
    const lineStr = group.sort((a, b) => a.transform[4] - b.transform[4])
      .map(x => x.str.trim()).filter(Boolean).join(' ');
    if (lineStr) lines.push(lineStr);
  }
  return lines.join('\n');
}

function normalizeText(s) {
  return s
    .replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/[．｡]/g, '.')
    .replace(/[－−]/g, '-')
    .replace(/，/g, ',')
    .replace(/　/g, ' ');
}

async function extractPdfPages(file) {
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf, cMapUrl: 'https://unpkg.com/pdfjs-dist@3.11.174/cmaps/', cMapPacked: true }).promise;
  const pages = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    pages.push(normalizeText(itemsToText(content.items)));
  }
  return pages;
}

function findAmount(txt, patterns, def = 0) {
  for (const pat of patterns) {
    const m = txt.match(new RegExp(pat, 's'));
    if (m) return parseAmount(m[1]);
  }
  return def;
}

const YEN_AMT = String.raw`¥\s*([-]?[\d,]+)`;

function parsePage1(txt) {
  const furikomi = findAmount(txt, [
    String.raw`\(A\)[^¥\n]*` + YEN_AMT,
    String.raw`お振込金額[^\n]*\n[^\n]*` + YEN_AMT,
    String.raw`振込金額[^\n¥]*` + YEN_AMT,
  ]);

  let tsumitate = 0;
  { const re = /保証金[^\n]*請求金額\s*([-]?[\d,]+)/gs;
    let m; while ((m = re.exec(txt)) !== null) tsumitate += Math.abs(parseAmount(m[1])); }

  let henkan = 0;
  let henkanMo = null;
  { const re = /(\d{1,2})月精算分保証金[^\n]*返金金額\s*([\d,]+)/gs;
    let m; while ((m = re.exec(txt)) !== null) {
      henkan += parseAmount(m[2]);
      if (henkanMo === null) henkanMo = +m[1];
    }
    if (!henkan) {
      const re2 = /保証金[^\n]*返金金額\s*([\d,]+)/gs;
      let m2; while ((m2 = re2.exec(txt)) !== null) henkan += parseAmount(m2[1]);
    }
  }

  const furikoT = findAmount(txt, [
    String.raw`振込事務手数料[^¥\n]*` + YEN_AMT,
    String.raw`振込手数料[^¥\n]*` + YEN_AMT,
    String.raw`10%対象\s+[\d,]+\s+[\d,]+\s+([\d,]+)`,
  ]);

  return { furikomi, tsumitate, henkan, henkanMo, furikoT };
}

function parseDetailPage(txt) {
  const uriage = findAmount(txt, [
    String.raw`売上金額\s*\(A\)\s*([\d,]+)`,
    String.raw`合計\s+[\d,]+\s+([\d,]+)\s+[\d,]+\s+-`,
    String.raw`売上代金合計[^\n¥]*` + YEN_AMT,
    String.raw`売上代金合計\s*([-▲△]?\s*[\d,]+)\s*円`,
  ]);

  const tesIncl = findAmount(txt, [
    String.raw`10%対象\s+[\d,]+\s+[\d,]+\s+([\d,]+)`,
    String.raw`取扱手数料[（(]税込[）)][^\n¥]*` + YEN_AMT,
    String.raw`手数料合計[^\n¥]*` + YEN_AMT,
    String.raw`取扱手数料[（(]税込[）)]\s*([-▲△]?\s*[\d,]+)\s*円`,
  ]);

  const tesTax = findAmount(txt, [
    String.raw`消費税額合計\s*\([A-Z]\)\s*-\s*([\d,]+)`,
    String.raw`合計\s+-\s+([\d,]+)\s+-`,
    String.raw`消費税[（(]10%[）)][^\n¥]*` + YEN_AMT,
    String.raw`消費税\s*([-▲△]?\s*[\d,]+)\s*円`,
  ]);

  const m = txt.match(/(\d{4})年(\d{2})月(\d{2})日\s*[～~]\s*(\d{4})年(\d{2})月(\d{2})日/);
  const periodEnd = m ? [+m[4], +m[5], +m[6]] : null;
  const type = /売上金額\s*\(A\)/.test(txt) ? '銀振' : 'クレカ';
  return { uriage, tesIncl, tesTax, periodEnd, type };
}

async function parsePdf(file) {
  const pages = await extractPdfPages(file);
  if (!pages.length) throw new Error('テキストを取得できませんでした');
  _debugTexts.push({ filename: file.name, pages });

  // 選択中の会社の宛先チェック
  if (selectedCompany) {
    const co = COMPANIES[selectedCompany];
    if (!co.check.test(pages[0])) {
      throw new Error(`1ページ目に「株式会社${co.label}」宛の記載が見つかりません`);
    }
  }

  const p1 = parsePage1(pages[0]);
  const sections = [];
  let periodEnd = null;
  for (const txt of pages.slice(1)) {
    const d = parseDetailPage(txt);
    sections.push({ uriage: d.uriage, tesIncl: d.tesIncl, tesTax: d.tesTax, type: d.type });
    if (!periodEnd &amp;&amp; d.periodEnd) periodEnd = d.periodEnd;
  }
  if (!periodEnd) throw new Error('売上代金対象期間が見つかりません');
  return { ...p1, sections, periodEnd };
}

function buildVoucher(siteName, data, dateStr, vno) {
  const cfg = SITE_CONFIG[siteName];
  const { torihiki: tk, kamoku: km, bumon: bm } = cfg;
  const { furikomi, tsumitate, henkan, henkanMo, furikoT, sections, periodEnd } = data;
  const billing = furikomi < 0;
  const mo = periodEnd[1];
  const pfx = `${mo}月${siteName}　`;

  const rows = [];

  const addRow = ({ drKamoku='', drTorihiki='', drBumon='', drAmt=0, drTax='', drTaxAmt=0,
                    crKamoku='', crTorihiki='', crBumon='', crAmt=0, crTax='', crTaxAmt=0,
                    summary='' } = {}) => {
    if (!drAmt &amp;&amp; !crAmt) return;
    const row = detailRow({
      dateStr,
      drKamoku, drTorihiki, drBumon, drAmt, drTax, drTaxAmt,
      drBiko: drAmt ? summary : '',
      crKamoku, crTorihiki, crBumon, crAmt, crTax, crTaxAmt,
      crBiko: crAmt ? summary : '',
    });
    row[2] = vno;
    rows.push(row);
  };

  if (!billing &amp;&amp; furikomi !== 0)
    addRow({ drKamoku:'売掛金',     drTorihiki:'ROBOT PAYMENT', drAmt:furikomi,  drTax:'対象外',
             summary: pfx + '売上' });
  for (const s of sections)
    if (s.tesIncl > 0)
      addRow({ drKamoku:'支払手数料', drTorihiki:'ROBOT PAYMENT', drAmt:s.tesIncl, drTax:'課対仕入10%', drTaxAmt:s.tesTax,
               summary: pfx + (s.type === '銀振' ? '銀行手数料' : 'クレカ手数料') });
  if (tsumitate > 0)
    addRow({ drKamoku:'預け金',     drTorihiki:'ROBOT PAYMENT', drAmt:tsumitate, drTax:'対象外',
             summary: `${mo}月売上分保証金` });
  if (!billing &amp;&amp; furikoT > 0)
    addRow({ drKamoku:'支払手数料', drTorihiki:'ROBOT PAYMENT', drAmt:furikoT,   drTax:'課対仕入10%', drTaxAmt:Math.floor(furikoT/11),
             summary: pfx + '振込手数料' });

  for (const s of sections)
    if (s.uriage > 0) {
      const taxable = (km === '売上高');
      addRow({ crKamoku:km, crTorihiki:tk, crBumon:bm, crAmt:s.uriage,
               crTax: taxable ? '課税売上10%' : '対象外',
               crTaxAmt: taxable ? Math.floor(s.uriage / 11) : 0,
               summary: pfx + (s.type === '銀振' ? '銀行売上' : 'クレカ売上') });
    }
  if (henkan > 0)
    addRow({ crKamoku:'預け金',   crTorihiki:'ROBOT PAYMENT', crBumon:bm, crAmt:henkan, crTax:'対象外',
             summary: `${henkanMo ?? mo}月精算分保証金` });
  if (billing)
    addRow({ crKamoku:'未払費用', crTorihiki:'ROBOT PAYMENT', crBumon:bm, crAmt:Math.abs(furikomi), crTax:'対象外',
             summary: pfx + 'マイナス分' });

  return rows;
}

function verifyBalance(rows) {
  let dr = 0, cr = 0;
  for (const r of rows) {
    if (r[0] === '[明細行]') {
      dr += r[15] ? parseInt(r[15]) : 0;
      cr += r[29] ? parseInt(r[29]) : 0;
    }
  }
  return { dr, cr, ok: dr === cr };
}

async function processFiles(files) {
  _debugTexts = [];
  setProgress(0, 'PDFを読み込み中...');
  showErrors([]);

  const groups = new Map();
  const errors = [];

  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    const siteName = stemToSite(f.name.replace(/\.pdf$/i, ''));
    const cfg = SITE_CONFIG[siteName];
    if (!cfg) {
      errors.push(`スキップ (設定なし): ${f.name}`);
      continue;
    }
    // 選択会社と異なるサイトはスキップ
    if (selectedCompany &amp;&amp; cfg.company !== selectedCompany) {
      errors.push(`スキップ (会社不一致): ${f.name} → ${COMPANIES[cfg.company]?.label ?? cfg.company} のサイトです`);
      continue;
    }
    setProgress((i / files.length) * 60, `${f.name} を解析中...`);
    try {
      const data = await parsePdf(f);
      const [yr, mo] = data.periodEnd;
      const key = `${siteName}|${yr}|${mo}`;
      if (groups.has(key)) {
        const ex = groups.get(key);
        ex.furikomi  += data.furikomi;
        ex.tsumitate += data.tsumitate;
        ex.henkan    += data.henkan;
        ex.furikoT   += data.furikoT;
        ex.sections.push(...data.sections);
        if (ex.henkanMo === null &amp;&amp; data.henkanMo !== null) ex.henkanMo = data.henkanMo;
      } else {
        groups.set(key, { ...data, sections: [...data.sections] });
      }
    } catch (e) {
      errors.push(`${f.name}: ${e.message}`);
    }
  }

  showErrors(errors);

  function sortKey(key) {
    const [site, yr, mo] = key.split('|');
    const idx = SITE_ORDER.indexOf(site);
    return (+yr) * 10000 + (+mo) * 100 + (idx < 0 ? 99 : idx);
  }
  const sortedKeys = [...groups.keys()].sort((a, b) => sortKey(a) - sortKey(b));

  const counters = {};
  const assignments = [];
  for (const key of sortedKeys) {
    const [site, yrStr, moStr] = key.split('|');
    const yr = +yrStr, mo = +moStr;
    const ym = `${yr}-${mo}`;
    counters[ym] = (counters[ym] || 0) + 1;
    const cnt = counters[ym];
    const dd = lastDay(yr, mo);
    const dateStr = `${yr}/${String(mo).padStart(2,'0')}/${String(dd).padStart(2,'0')}`;
    const siteNo = SITE_CONFIG[site]?.no;
    const vno = `${yr}${String(mo).padStart(2,'0')}${siteNo ?? String(cnt).padStart(3,'0')}`;
    assignments.push({ site, data: groups.get(key), dateStr, vno });
  }

  setProgress(70, 'CSV生成中...');

  const allRows = [CSV_HEADER];
  const results = [];
  for (const { site, data, dateStr, vno } of assignments) {
    const rows = buildVoucher(site, data, dateStr, vno);
    const bal = verifyBalance(rows);
    results.push({ site, vno, dateStr, ...bal, billing: data.furikomi < 0 });
    allRows.push(...rows);
  }

  setProgress(100, '完了');

  const csvText = '﻿' + allRows.map(rowToCsv).join('\r\n');

  renderResults(results);
  renderCsv(csvText, assignments);
  renderDebug();
  document.getElementById('progressWrap').hidden = true;
}

function escHtml(s) {
  return String(s).replace(/&amp;/g,'&amp;amp;').replace(/</g,'&amp;lt;').replace(/>/g,'&amp;gt;');
}

let _csvText = '';

function renderResults(results) {
  const card = document.getElementById('resultsCard');

function renderCsv(csvText, assignments) {
  _csvText = csvText;

  const lines = csvText.split('\r\n');
  const preview = lines.slice(0, 20).join('\n') + (lines.length > 20 ? `\n… 合計 ${lines.length} 行` : '');
  document.getElementById('csvArea').value = preview;

  if (assignments.length) {
    const { dateStr } = assignments[0];
    const [yr, mo] = dateStr.split('/');
    const ymStr = `${yr}${mo}`;
    const sites = [...new Set(assignments.map(a => a.site))];
    if (sites.length === 1) {
      _dlName = `仕訳インポート_${ymStr}_${sites[0]}.csv`;
    } else {
      _dlName = `仕訳インポート_${ymStr}_${sites[0]}他${sites.length - 1}件.csv`;
    }
  }
}

// ── State ─────────────────────────────────────
let currentMonth = (() => { try { return localStorage.getItem('selectedMonth') || '2026-07'; } catch(e) { return '2026-07'; } })();
let DATA = null;

function makeBlankData() {
  const blank = {};
  [...SITES, ...SELF_SITES].forEach(s => { blank[s.id] = {}; COLS.forEach(c => { blank[s.id][c.id] = 0; }); });
  return blank;
}

function setSyncStatus(msg) {
  const el = document.getElementById('syncStatus');
  if (el) el.textContent = msg;
}

function subscribeMonth(m) {
  if (_dbRef) _dbRef.off();
  _dbRef = _db.ref('data/' + m);
  _dbRef.on('value', (snap) => {
    if (_writePending) return;
    const val = snap.val();
    if (!val) {
      DATA = m === '2026-07' ? JSON.parse(JSON.stringify(DEFAULT_2026_07)) : makeBlankData();
      _db.ref('data/' + m).set(DATA);
    } else {
      DATA = val;
    }
    renderAll();
    setSyncStatus('同期済み ✓');
  }, (err) => {
    setSyncStatus('接続エラー');
    console.error(err);
  });
}

function saveData(m, d) {
  _writePending = true;
  setSyncStatus('保存中…');
  if (_writeTimer) clearTimeout(_writeTimer);
  _writeTimer = setTimeout(() => {
    _db.ref('data/' + m).set(d)
      .then(() => { setTimeout(() => { _writePending = false; setSyncStatus('同期済み ✓'); }, 300); })
      .catch(() => { _writePending = false; setSyncStatus('保存エラー'); });
  }, 800);
}

function setIssueDateToNextMonth(ym) {
  const [y, m] = ym.split('-').map(Number);
  const next = m === 12 ? `${y+1}-01-01` : `${y}-${String(m+1).padStart(2,'0')}-01`;
  const el = document.getElementById('issueDate');
  if (el) el.value = next;
}

async function onMonthChange() {
  currentMonth = document.getElementById('globalMonth').value;
  try { localStorage.setItem('selectedMonth', currentMonth); } catch(e) {}
  setSyncStatus('読込中…');
  setIssueDateToNextMonth(currentMonth);
  subscribeMonth(currentMonth);
  document.getElementById('pdfResults').innerHTML = '';
  document.getElementById('pdfSessionArea').style.display = 'none';
  _processedFileNames.clear();
  loadPdfHistory(currentMonth);
}

async function initData() {
  setSyncStatus('読込中…');
  document.getElementById('globalMonth').value = currentMonth;
  setIssueDateToNextMonth(currentMonth);
  await _db.ref('suiMapping').once('value').then(s => { _suiMappingCache = s.val() || {}; });
  subscribeMonth(currentMonth);
  loadPdfHistory(currentMonth);
}

function getVal(sid, cid) { return (DATA[sid] && DATA[sid][cid]) ? +DATA[sid][cid] : 0; }

function setVal(sid, cid, val) {
  if (!DATA[sid]) DATA[sid] = {};
  DATA[sid][cid] = +val || 0;
  saveData(currentMonth, DATA);
  const el = document.getElementById('rowtotal-' + sid);
  if (el) el.textContent = fmt(rowTotal(sid));
  refreshGroupTotals();
  if (document.getElementById('tab-summary').classList.contains('active')) renderSummary();
  if (document.getElementById('tab-invoice').classList.contains('active')) renderInvoices();
}

function rowTotal(sid) { return COLS.reduce((s, c) => s + getVal(sid, c.id), 0); }
function relTotal(rid) { return SITES.filter(s => s.rel === rid).reduce((s, site) => s + rowTotal(site.id), 0); }
function selfTotal(owner) { return SELF_SITES.filter(s => s.owner === owner).reduce((s, site) => s + rowTotal(site.id), 0); }

// ── Formatting ────────────────────────────────
function fmt(n) { if (!n) return '¥0'; if (n < 0) return '-¥' + Math.abs(n).toLocaleString('ja-JP'); return '¥' + n.toLocaleString('ja-JP'); }
function fmtN(n) { return (n || 0).toLocaleString('ja-JP'); }
function periodStr(ym) { const [y,m] = ym.split('-').map(Number); const last = new Date(y,m,0).getDate(); return `${y}/${m}/1　〜　${y}/${m}/${last}`; }
function periodMonth(ym) { const [y,m] = ym.split('-').map(Number); return `${y}/${m}`; }
function issueDateStr(d) { if (!d) return ''; const dt = new Date(d+'T00:00:00'); return `${dt.getFullYear()}年${dt.getMonth()+1}月${dt.getDate()}日`; }

// ── Tab switching ─────────────────────────────
function switchTab(name, btn) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  btn.classList.add('active');
  if (name === 'summary') renderSummary();
  if (name === 'summarySelf') renderSummarySelf();
  if (name === 'invoice') renderInvoices();
  if (name === 'pdf') loadPdfHistory(currentMonth);
}

// ── PDF History ────────────────────────────────
function saveHistory(cardId) {
  const card = document.getElementById(cardId);
  if (!card || !card._smartResult) return;
  const result = card._smartResult;
  const entry = {
    fileName: card._fileName || '不明',
    format: result.format,
    period: result.period || null,
    entries: result.entries.map(e => ({ siteId: e.siteId, col: e.col, amount: e.amount })),
    appliedAt: new Date().toISOString()
  };
  _db.ref(`pdfHistory/${currentMonth}/${Date.now()}`).set(entry)
    .then(() => loadPdfHistory(currentMonth));
}

async function loadPdfHistory(month) {
  const el = document.getElementById('pdfHistoryList');
  const countEl = document.getElementById('pdfHistoryCount');
  if (!el) return;
  const snap = await _db.ref(`pdfHistory/${month}`).once('value');
  const data = snap.val() || {};
  const items = Object.entries(data)
    .map(([key, v]) => ({ key, ...v }))
    .sort((a, b) => b.appliedAt.localeCompare(a.appliedAt));
  if (countEl) countEl.textContent = items.length || '';
  if (items.length === 0) {
    el.innerHTML = '<p style="color:var(--muted);font-size:12px">この月の履歴はありません</p>';
    return;
  }
  const allSites = [...SITES, ...SELF_SITES];
  el.innerHTML = items.map(item => {
    const dt = new Date(item.appliedAt);
    const dateStr = `${dt.getFullYear()}/${String(dt.getMonth()+1).padStart(2,'0')}/${String(dt.getDate()).padStart(2,'0')} ${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`;
    const periodLabel = item.period ? item.period.replace(/^(\d{4})-(\d{2})$/, '$1年$2月') : '';
    const entrySummary = (item.entries || []).map(e => {
      const site = allSites.find(s => s.id === e.siteId);
      const col = COLS.find(c => c.id === e.col);
      return `<span style="display:inline-block;background:#f0f4ff;border-radius:4px;padding:2px 8px;margin:2px 2px 2px 0;font-size:11px">${site?.name || e.siteId} <b>${col?.label.replace('\n','') || e.col}</b> ${fmt(e.amount)}</span>`;
    }).join('');
    return `<div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin-bottom:8px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;flex-wrap:wrap;gap:4px">
        <span style="font-size:13px;font-weight:700">📄 ${item.fileName}</span>
        <span style="font-size:11px;color:var(--muted)">${dateStr}</span>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">
        <span style="background:#dbeafe;color:#1e40af;padding:2px 10px;border-radius:10px;font-size:11px;font-weight:700">${item.format}</span>
        ${periodLabel ? `<span style="background:#dcfce7;color:#166534;padding:2px 10px;border-radius:10px;font-size:11px;font-weight:700">📅 ${periodLabel}</span>` : ''}
      </div>
      <div>${entrySummary}</div>
    </div>`;
  }).join('');
}

function refreshGroupTotals() {
  // billing groups
  const groups = [
    { rels: [0,1,6,7] }, { rels: [2,3] }, { rels: [4,5,8] }
  ];

  document.querySelectorAll('.group-header-total').forEach((el, i) => {
    if (groups[i]) {
      const tot = groups[i].rels.reduce((s, rid) => s + relTotal(rid), 0);
      el.textContent = '合計：' + fmt(tot);
    }
  });
  // self groups
  const owners = ['sunny','ride','ichi'];
  document.querySelectorAll('.self-header-total').forEach((el, i) => {
    if (owners[i]) el.textContent = '合計：' + fmt(selfTotal(owners[i]));
  });
  // 小計行（rel グループ）
  RELS.forEach(rel => {
    const relSites = SITES.filter(s => s.rel === rel.id);
    COLS.forEach(c => {
      const el = document.getElementById(`sub-rel${rel.id}-${c.id}`);
      if (el) { const v = relSites.reduce((s, site) => s + getVal(site.id, c.id), 0); el.textContent = v ? fmtN(v) : ''; }
    });
    const totEl = document.getElementById(`sub-rel${rel.id}-total`);
    if (totEl) totEl.textContent = fmt(relTotal(rel.id));
  });
  // 小計行（self グループ）
  ['sunny','ride','ichi','include'].forEach(owner => {
    const sSites = SELF_SITES.filter(s => s.owner === owner);
    COLS.forEach(c => {
      const el = document.getElementById(`sub-self${owner}-${c.id}`);
      if (el) { const v = sSites.reduce((s, site) => s + getVal(site.id, c.id), 0); el.textContent = v ? fmtN(v) : ''; }
    });
    const totEl = document.getElementById(`sub-self${owner}-total`);
    if (totEl) totEl.textContent = fmt(selfTotal(owner));
  });
  // リミット
  const limTot = LIMIT_GROUPS.reduce((s,g) => s + g.siteIds.reduce((ss,sid) => ss + getVal(sid,'lim'), 0), 0);
  const limHeader = document.querySelector('.lim-total-header');
  if (limHeader) limHeader.textContent = '合計：' + fmt(limTot);
  LIMIT_GROUPS.forEach((g, i) => {
    const grpTot = g.siteIds.reduce((s,sid) => s + getVal(sid,'lim'), 0);
    const grpEl = document.getElementById('limgrp-' + i);
    if (grpEl) grpEl.textContent = fmt(grpTot);
    const subEl = document.getElementById('limsub-' + i);
    if (subEl) subEl.textContent = grpTot ? fmtN(grpTot) : '';
  });
  renderInvSelect();
}

  const sel = document.getElementById('invSelect');
  if (!sel) return;
  const prev = sel.value;
  let html = '<option value="all-12">全件一覧（14枚）</option>';
  html += '<option value="all">リミット銀振以外（9枚）</option>';
  RELS.forEach(rel => {
    if (relTotal(rel.id) > 0) html += `<option value="${rel.id}">${rel.label}</option>`;
  });
  const limItems = LIMIT_GROUPS.map((grp, idx) => {
    const tot = grp.siteIds.reduce((s, sid) => s + getVal(sid, 'lim'), 0);
    return tot > 0 ? { idx, name: grp.name } : null;
  }).filter(Boolean);
  if (limItems.length > 0) {
    html += '<optgroup label="リミット銀振分配"><option value="lim-all">リミット分 一覧（5枚）</option>';
    limItems.forEach(({ idx, name }) => { html += `<option value="lim-${idx}">リミット → ${name}</option>`; });
    html += '</optgroup>';
  }
  sel.innerHTML = html;
  if ([...sel.options].some(o => o.value === prev)) sel.value = prev;
}

function buildSiteRows(sites) {
  return sites.map(site => {
    const tot = rowTotal(site.id);
    let cells = COLS.map(c => {
      const v = getVal(site.id, c.id);
      return `<td style="padding:2px 4px"><input class="num-input" type="number" value="${v}"
        data-site="${site.id}" data-col="${c.id}"
        onfocus="if(+this.value===0)this.value=''"
        onblur="if(this.value===''){this.value='0';setVal('${site.id}','${c.id}',0);}"
        onkeydown="if(event.key==='Enter'){if(this.value==='')this.value='0';this.blur();event.preventDefault();}"
        onchange="setVal('${site.id}','${c.id}',+this.value)"></td>`;
    }).join('');
    return `<tr><td class="site-name">${site.name}</td>${cells}<td class="total-cell" id="rowtotal-${site.id}">${fmt(tot)}</td></tr>`;
  }).join('');
}

function buildSubtotalRow(sites, groupKey) {
  let cells = COLS.map(c => {
    const colSum = sites.reduce((s, site) => s + getVal(site.id, c.id), 0);
    const id = groupKey ? ` id="sub-${groupKey}-${c.id}"` : '';
    return `<td${id} style="text-align:right;padding:4px 10px">${colSum ? fmtN(colSum) : ''}</td>`;
  }).join('');
  const tot = sites.reduce((s, site) => s + rowTotal(site.id), 0);
  const totId = groupKey ? ` id="sub-${groupKey}-total"` : '';
  return `<tr class="subtotal-row"><td class="site-name">小 計</td>${cells}<td${totId} class="total-cell">${fmt(tot)}</td></tr>`;
}

const _processedFileNames = new Set();

async function processFiles(files) {
  for (const file of files) {
    if (_processedFileNames.has(file.name)) {
      if (!confirm(`「${file.name}」はすでに追加されています。\n再度追加しますか？`)) continue;
    }
    _processedFileNames.add(file.name);
    await processPDF(file);
  }
}

async function processPDF(file) {
  const container = document.getElementById('pdfResults');
  const cardId = 'pdfcard_' + Date.now() + '_' + Math.random().toString(36).slice(2);

  const card = document.createElement('div');
  card.className = 'pdf-card';
  card.id = cardId;
  card.innerHTML = `<div class="pdf-card-header">
    <span>📄 ${file.name}</span>
    <span class="pdf-status">読み込み中…</span>
    <button onclick="removePdfCard('${cardId}','${file.name}')" style="margin-left:auto;background:none;border:none;color:#999;font-size:16px;cursor:pointer;padding:0 4px" title="カードを削除">✕</button>
  </div>
  <div class="pdf-card-body"><p style="color:var(--muted);font-size:12px">テキストを抽出しています…</p></div>`;
  card._fileName = file.name;
  document.getElementById('pdfSessionArea').style.display = 'block';
  container.insertBefore(card, container.firstChild);

  try {
    const text = await extractPDFText(file);
    const smart = smartParsePDF(file.name, text);
    if (smart) {
      renderSmartCard(card, smart);
    } else {
      const amounts = detectAmounts(text);
      renderPDFCard(card, file.name, text, amounts);
    }
  } catch(err) {
    card.querySelector('.pdf-card-body').innerHTML = `<p style="color:var(--red);font-size:12px">読み込みエラー: ${err.message}</p>`;
    card.querySelector('.pdf-status').textContent = 'エラー';
  }
}

async function extractPDFText(file) {
  if (typeof pdfjsLib === 'undefined') throw new Error('PDF.jsが読み込まれていません');
  const ab = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: ab, cMapUrl: 'https://unpkg.com/pdfjs-dist@3.11.174/cmaps/', cMapPacked: true }).promise;
  let text = '';
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    text += content.items.map(it => it.str).join(' ') + '\n';
  }
  return text;
}

function smartParsePDF(filename, text) {
  if (/LINQSEA/.test(text)) return parseLINQSEA(text);
  if (/マックスコネクト/.test(text)) return parseMaxConnect(text);
  if (/CREDIX|No\.CTM\d|サービス種別\s*[\S\s]{0,20}クレジット/.test(text)) return parseCREDIX(text);
  if (/SU HONG KONG|クレジット決済計算書/.test(text)) return parseSUI(text);
  if (/株式会社ROBOT PAYMENT/.test(text)) return parseRobotPayment(text);
  if (/ユニヴァ・ペイキャスト|univapay/i.test(text)) return parseUPC(text);

function extractPeriod(text) {
  // 決済期間を最優先（YYYY-MM-DD形式）
  let m = text.match(/決\s*済\s*期\s*間[^0-9]{0,8}(\d{4})-(\d{2})-\d{2}/);
  if (m) return `${m[1]}-${m[2]}`;
  // 決済期間YYYYMMDD形式（マックスコネクト銀振: "決済期間：20260801-20260831"）
  m = text.match(/決\s*済\s*期\s*間[^0-9]{0,10}(\d{4})(\d{2})\d{2}/);
  if (m) return `${m[1]}-${m[2]}`;
  // YYYY年MM月
  m = text.match(/(\d{4})年\s*(\d{1,2})月/);
  if (m) return `${m[1]}-${String(m[2]).padStart(2,'0')}`;
  // YYYY/MM/DD or YYYY/MM
  m = text.match(/(\d{4})\/(\d{2})(?:\/\d{2})?/);
  if (m) return `${m[1]}-${m[2]}`;
  return null;
}

function parseLINQSEA(text) {
  const entries = [];
  const rowRe = /(\d{1,2})\s+(.+?)\s+(\d{6})\s+([\d,]+)\s+([\d,]+)/g;
  let m;
  while ((m = rowRe.exec(text)) !== null) {
    const idx = parseInt(m[1]);
    if (idx < 1 || idx > 99) continue;
    const name = m[2].trim();
    if (name === '合計' || name === '') continue;
    const amount = parseInt(m[5].replace(/,/g,''));
    if (amount <= 0) continue;
    const site = findSiteByName(name);
    if (site) entries.push({ siteId: site.id, col: 'rc', amount });
  }
  return { format: 'LINQSEA（リンクシー）', entries, unmappedIds: {}, period: extractPeriod(text) };
}

function parseSUI(text) {
  // Fix PDF page-break artifact where "7\n6208812..." splits to "7 6208812..."
  text = text.replace(/(?<!\d)7 (\d{7})/g, '7$1');
  const totals = {};
  // Try transaction-level format (with or without spaces between fields)
  const txRe = /(\d{8})\s*[0-9X]{16}\s*\d{13}\s*\d{14}\s*売\s*上\s*確\s*定\s*([\d,]+)/g;
  let m;
  while ((m = txRe.exec(text)) !== null) {
    const id = m[1];
    const amt = parseInt(m[2].replace(/,/g,''));
    totals[id] = (totals[id] || 0) + amt;
  }
  // Fallback: summary-format — find each known SUI ID and take the largest nearby comma-amount
  if (Object.keys(totals).length === 0) {
    for (const suiId of Object.keys(SUI_SITE_MAP)) {
      const idx = text.indexOf(suiId);
      if (idx === -1) continue;
      const snippet = text.substring(idx, idx + 200);
      const amtMatches = [...snippet.matchAll(/(\d{1,3}(?:,\d{3})+)/g)].map(r => parseInt(r[1].replace(/,/g,'')));
      if (amtMatches.length > 0) {
        const best = Math.max(...amtMatches);
        if (best > 1000) totals[suiId] = best;
      }
    }
  }

  // Merge hardcoded + localStorage mappings
  const mapping = { ...SUI_SITE_MAP, ...getSuiMapping() };
  const allSites = [...SITES, ...SELF_SITES];
  const entries = [];
  const unmappedIds = {};

  for (const [suiId, amount] of Object.entries(totals)) {
    const siteId = mapping[suiId];
    if (siteId && allSites.find(s => s.id === siteId)) {
      entries.push({ siteId, col: 'sui', amount });
    } else {
      unmappedIds[suiId] = amount;
    }
  }
  return { format: 'SUI（プライムバンテージ）', entries, unmappedIds, period: extractPeriod(text) };
}

function parseMaxConnect(text) {
  const entries = [];

  // 銀振: "銀行振込決済計算書" at top center — \s* for PDF.js char spacing
  if (/銀\s*行\s*振\s*込\s*決\s*済\s*計\s*算\s*書/.test(text)) {
    const siteNameM = text.match(/サイト名[：:]\s*(.+)/);
    const siteName = siteNameM ? siteNameM[1].trim() : '';
    const site = findSiteByName(siteName);
    const amtM = text.match(/決\s*済\s*額\s+([\d,]+)/);
    if (site && amtM) {
      const amount = parseInt(amtM[1].replace(/,/g,''));
      if (amount > 0) entries.push({ siteId: site.id, col: 'maxb', amount });
    }
    return { format: 'マックスコネクト（銀振）', entries, unmappedIds: {}, period: extractPeriod(text) };
  }

  // クレカ: "支払明細書" at top left — Japanese chars space-separated by PDF.js
  // Capture merchant name and amount from 1st row of 支払金額内訳
  const amtM = text.match(/株\s*式\s*会\s*社\s*(.+?)\s+決\s*済\s*額\s+([\d,]+)/);
  const merchant = amtM ? amtM[1].trim() : '';
  const total = amtM ? parseInt(amtM[2].replace(/,/g,'')) : 0;

  if (total > 0) {
    const ownerMap = [
      ['Sunny Lab', 'self_milli'],
      ['SunnyLab',  'self_milli'],
      ['サニーラボ', 'self_milli'],
      ['RIDE PLAN', 'self_tansen'],
      ['ライドプラン', 'self_tansen'],
      ['1.2.3', 'self_imrich'],
      ['ワンツースリー', 'self_imrich'],
    ];
    for (const [key, siteId] of ownerMap) {
      if (merchant.includes(key)) {
        entries.push({ siteId, col: 'max', amount: total });
        break;
      }
    }
  }
  return { format: 'マックスコネクト（クレカ）', entries, unmappedIds: {}, period: extractPeriod(text) };
}

function parseCREDIX(text) {
  const entries = [];
  const siteM = text.match(/サイト名\s+(.+)/);
  const siteName = siteM ? siteM[1].trim() : '';
  const site = findSiteByName(siteName);
  if (!site) return { format: 'CREDIX（未認識：' + siteName + '）', entries, unmappedIds: {}, period: extractPeriod(text) };
  const amtM = text.match(/お支払額\s*\(JPY\)\s*([\d,]+)/);
  if (amtM) {
    const amount = parseInt(amtM[1].replace(/,/g,''));
    if (amount > 0) entries.push({ siteId: site.id, col: 'credix', amount });
  }
  return { format: 'CREDIX（' + site.name + '）', entries, unmappedIds: {}, period: extractPeriod(text) };
}

function parseRobotPayment(text) {
  const entries = [];
  // Extract store ID (合算先店舗ID or 店舗ID)
  const storeM = text.match(/店舗ID\s+(\d{5,6})/);
  if (!storeM) return null;
  const storeId = storeM[1];
  const siteId = RP_STORE_MAP[storeId];

  if (!siteId) {
    return { format: 'ROBOT PAYMENT（未登録 店舗' + storeId + '）', entries, unmappedIds: {}, rpUnknownStore: storeId };
  }

  // 売上代金対象期間 vs 月次対象月 でrc/rb か rc2/rb2 かを判定
  // 月次対象月 == 売上期間 → 通常 (rc/rb)
  // 月次対象月 > 売上期間 → 2ヶ月後 (rc2/rb2)
  const periodM = text.match(/売上代金対象期間\s+(\d{4})年(\d{2})月/);
  const serviceM = text.match(/月次対象月\s+(\d{4})年(\d{2})月/);
  let isDelayed = false;
  let pdfPeriod = null;
  if (periodM) {
    const py = parseInt(periodM[1]), pm = parseInt(periodM[2]);
    pdfPeriod = `${periodM[1]}-${periodM[2]}`;
    if (serviceM) {
      const sy = parseInt(serviceM[1]), sm = parseInt(serviceM[2]);
      isDelayed = (sy * 12 + sm) - (py * 12 + pm) >= 1;
    } else {
      const [cy, cm] = currentMonth.split('-').map(Number);
      isDelayed = (cy * 12 + cm) - (py * 12 + pm) >= 2;
    }
  }

  // クレカ: カード 売上代金計算書 → 合計 {件数} {金額(A)} {手数料}
  if (/クレジットカード/.test(text)) {
    const kcM = text.match(/合計\s+\d+\s+([\d,]+)\s+[\d,]+/);
    if (kcM) {
      const amount = parseInt(kcM[1].replace(/,/g,''));
      if (amount > 0) entries.push({ siteId, col: isDelayed ? 'rc2' : 'rc', amount });
    }
  }

  // 銀振: 銀行振込 売上代金計算書 → 売上金額 (A)
  if (/銀行振込/.test(text)) {
    const rbM = text.match(/売上金額\s*\(A\)\s+([\d,]+)/);
    if (rbM) {
      const amount = parseInt(rbM[1].replace(/,/g,''));
      if (amount > 0) entries.push({ siteId, col: isDelayed ? 'rb2' : 'rb', amount });
    }
  }

  const siteName = [...SITES, ...SELF_SITES].find(s => s.id === siteId)?.name || storeId;
  return { format: 'ROBOT PAYMENT（' + siteName + '）', entries, unmappedIds: {}, period: pdfPeriod };
}

function parseUPC(text) {
  const entries = [];
  // Extract site name: "加盟店名 ： {uuid} - {sitename}"
  const nameM = text.match(/加盟店名\s*[：:]\s*[\w\-]+ - (.+)/);
  const rawName = nameM ? nameM[1].trim() : '';

  let siteId = UPC_NAME_MAP[rawName];
  if (!siteId) {
    for (const [k, v] of Object.entries(UPC_NAME_MAP)) {
      if (rawName.includes(k) || k.includes(rawName)) { siteId = v; break; }
    }
  }
  // rawNameは "サイト名 集計期間 ..." と長いので先頭の名前部分だけ取り出す
  const cleanName = rawName.replace(/\s+集計期間[\s\S]*$/, '').trim() || rawName.split(/\s{2,}/)[0] || rawName;
  if (!siteId) return { format: 'ユニヴァ（未登録：' + cleanName + '）', entries, unmappedIds: {}, upcUnknownSite: cleanName };

  // GMOあおぞら 預かり金額(A)
  const amtM = text.match(/GMOあおぞら\s+¥([\d,]+)/);
  if (amtM) {
    const amount = parseInt(amtM[1].replace(/,/g,''));
    if (amount > 0) entries.push({ siteId, col: 'univa', amount });
  }

  // 集計期間を優先（発行日より先に来るYYYY年MM月に引っ張られないよう）
  const periodM = text.match(/集計期間\s*[：:]\s*(\d{4})年(\d{1,2})月/);
  const period = periodM ? `${periodM[1]}-${periodM[2].padStart(2,'0')}` : extractPeriod(text);

  const siteName = [...SITES, ...SELF_SITES].find(s => s.id === siteId)?.name || rawName;
  return { format: 'ユニヴァ（' + siteName + '）', entries, unmappedIds: {}, period };
}

function parsePaymentFor(text) {
  const entries = [];
  // Store name before company code: "BIGBONUS (K028539-001)"
  const storeM = text.match(/([A-Z][A-Z\s]+?)\s*\([A-Z]\d+-\d+\)/);
  const storeName = storeM ? storeM[1].trim() : '';

  let siteId = PMF_STORE_MAP[storeName];
  if (!siteId) {
    for (const [k, v] of Object.entries(PMF_STORE_MAP)) {
      if (storeName.includes(k) || k.includes(storeName)) { siteId = v; break; }
    }
  }
  if (!siteId) return { format: 'ペイメントフォー', entries, unmappedIds: {}, period: extractPeriod(text) };

  // Sum amounts from card-type rows: each row ends with "AMOUNT RATE%"
  let total = 0;
  const amtRe = /([\d,]+)\s+\d+\.\d+%/g;
  let amtM;
  while ((amtM = amtRe.exec(text)) !== null) {
    total += parseInt(amtM[1].replace(/,/g,''));
  }
  if (total > 0) entries.push({ siteId, col: 'pmf', amount: total });

  // Period: 発行日 > 対象期間 なので最も古い日付を使う
  const allDates = [...text.matchAll(/(\d{4})\/(\d{2})\/\d{2}/g)];
  const period = allDates.length > 0
    ? allDates.map(m => `${m[1]}-${m[2]}`).sort()[0]
    : extractPeriod(text);
  return { format: 'ペイメントフォー（PAYMENT FOR）', entries, unmappedIds: {}, period };
}

function applySmartFill(cardId) {
  const card = document.getElementById(cardId);
  if (!card || !card._smartResult) return;
  const result = card._smartResult;
  if (result.period && result.period !== currentMonth) {
    const pLabel = result.period.replace(/^(\d{4})-(\d{2})$/, '$1年$2月');
    const cLabel = currentMonth.replace(/^(\d{4})-(\d{2})$/, '$1年$2月');
    if (!confirm(`このPDFの集計期間は ${pLabel} ですが、現在選択中の月は ${cLabel} です。\n\n${pLabel} に切り替えて入力しますか？\n（「キャンセル」で ${cLabel} のまま入力）`)) {
      // Keep current month, just apply
    } else {
      currentMonth = result.period;
      document.getElementById('globalMonth').value = currentMonth;
      subscribeMonth(currentMonth);
      // Wait for data to load then apply
      const origApply = () => {
        const conf = result.entries.filter(e => getVal(e.siteId, e.col) !== 0);
        if (conf.length > 0) {
          const allS = [...SITES, ...SELF_SITES];
          const lines = conf.map(e => { const s = allS.find(x => x.id === e.siteId); const c = COLS.find(x => x.id === e.col); return `・${s?.name || e.siteId}（${c?.label.replace('\n',' ')}）: 現在 ${fmt(getVal(e.siteId, e.col))}`; }).join('\n');
          if (!confirm(`以下のセルにすでに値が入っています。上書きしますか？\n（OKで既存値を置き換え、キャンセルで中止）\n\n${lines}`)) return;
        }
        result.entries.forEach(e => setVal(e.siteId, e.col, conf.find(x => x.siteId === e.siteId && x.col === e.col) ? e.amount : getVal(e.siteId, e.col) + e.amount));
        card._applied = true;
        renderEntry();
        const applyBtn = [...card.querySelectorAll('button')].find(b => b.textContent.includes('一括自動入力'));
        if (applyBtn) {
          applyBtn.textContent = '✓ 入力済み'; applyBtn.disabled = true; applyBtn.style.opacity = '.6';
          const undoBtn = document.createElement('button');
          undoBtn.className = 'undo-btn';
          undoBtn.textContent = '↩ 取り消し';
          undoBtn.style.cssText = 'margin-left:8px;background:#dc2626;color:#fff;border:none;border-radius:4px;padding:8px 16px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer';
          undoBtn.onclick = () => undoSmartFill(cardId);
          applyBtn.parentNode.insertBefore(undoBtn, applyBtn.nextSibling);
        }
      };
      setTimeout(origApply, 1200);
      return;
    }
  }
  const conflicts = result.entries.filter(e => getVal(e.siteId, e.col) !== 0);
  if (conflicts.length > 0) {
    const allSites = [...SITES, ...SELF_SITES];
    const lines = conflicts.map(e => { const s = allSites.find(x => x.id === e.siteId); const c = COLS.find(x => x.id === e.col); return `・${s?.name || e.siteId}（${c?.label.replace('\n',' ')}）: 現在 ${fmt(getVal(e.siteId, e.col))}`; }).join('\n');
    if (!confirm(`以下のセルにすでに値が入っています。上書きしますか？\n（OKで既存値を置き換え、キャンセルで中止）\n\n${lines}`)) return;
  }
  result.entries.forEach(e => {
    setVal(e.siteId, e.col, conflicts.find(x => x.siteId === e.siteId && x.col === e.col) ? e.amount : getVal(e.siteId, e.col) + e.amount);
  });
  card._applied = true;
  saveHistory(cardId);
  renderEntry();
  const btns = card.querySelectorAll('button');
  const applyBtn = [...btns].find(b => b.textContent.includes('一括自動入力'));
  if (applyBtn) {
    applyBtn.textContent = '✓ 入力済み'; applyBtn.disabled = true; applyBtn.style.opacity = '.6';
    const undoBtn = document.createElement('button');
    undoBtn.className = 'undo-btn';
    undoBtn.textContent = '↩ 取り消し';
    undoBtn.style.cssText = 'margin-left:8px;background:#dc2626;color:#fff;border:none;border-radius:4px;padding:8px 16px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer';
    undoBtn.onclick = () => undoSmartFill(cardId);
    applyBtn.parentNode.insertBefore(undoBtn, applyBtn.nextSibling);
  }
}

function undoSmartFill(cardId) {
  const card = document.getElementById(cardId);
  if (!card || !card._smartResult || !card._applied) return;
  card._smartResult.entries.forEach(e => {
    setVal(e.siteId, e.col, getVal(e.siteId, e.col) - e.amount);
  });
  card._applied = false;
  renderEntry();
  const applyBtn = [...card.querySelectorAll('button')].find(b => b.textContent.includes('入力済み'));
  const undoBtn = card.querySelector('.undo-btn');
  if (applyBtn) { applyBtn.textContent = '▶ 一括自動入力'; applyBtn.disabled = false; applyBtn.style.opacity = '1'; }
  if (undoBtn) undoBtn.remove();
}

function updateEntryCol(cardId, index, newCol) {

    if (sel && sel.value) mapping[suiId] = sel.value;

  saveSuiMapping(mapping);

  // Re-parse and apply
  const card = document.getElementById(cardId);

}

function detectAmounts(text) {
  // Find numbers that look like yen amounts (>= 100, with or without commas)
  const seen = new Set();
  const results = [];
  // Pattern: ¥ followed by number, or comma-formatted number, or plain number >= 1000
  const patterns = [
    /[¥￥]\s*([\d,]+)/g,
    /(\d{1,3}(?:,\d{3})+)/g,
  ];
  for (const pat of patterns) {
    let m;
    while ((m = pat.exec(text)) !== null) {
      const raw = m[1].replace(/,/g,'');
      const n = parseInt(raw);
      if (n >= 100 && !seen.has(n)) {
        seen.add(n);
        results.push(n);
      }
    }
  }
  return results.sort((a,b) => b - a).slice(0, 30);
}

function selectChip(el, cardId, amount) {

  document.querySelectorAll(`#chips-${cardId} .amount-chip`).forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  selectedChips[cardId] = amount;
  const inp = document.getElementById('aamt-' + cardId);
  if (inp) inp.value = amount;
}

function assignAmount(cardId) {
  const siteId = document.getElementById('asite-' + cardId).value;
  const colId  = document.getElementById('acol-' + cardId).value;
  const amount = parseInt(document.getElementById('aamt-' + cardId).value) || 0;
  if (!amount) { alert('金額を入力してください'); return; }

  // Add to existing value
  const current = getVal(siteId, colId);
  setVal(siteId, colId, current + amount);

  // Update input field in entry tab
  const inp = document.querySelector(`input[data-site="${siteId}"][data-col="${colId}"]`);
  if (inp) inp.value = getVal(siteId, colId);

  // Show in assigned list
  const site = [...SITES, ...SELF_SITES].find(s => s.id === siteId);
  const col  = COLS.find(c => c.id === colId);
  const list = document.getElementById('assigned-' + cardId);
  const item = document.createElement('div');
  item.className = 'assigned-item';
  item.innerHTML = `<span>✓ ${site?.name} / ${col?.label.replace('\n',' ')} → <strong>${fmt(amount)}</strong>（累計：${fmt(getVal(siteId,colId))}）</span>`;
  list.appendChild(item);

  // Clear selection
  document.getElementById('aamt-' + cardId).value = '';
  if (document.querySelectorAll(`#chips-${cardId} .amount-chip.selected`).length) {
    document.querySelectorAll(`#chips-${cardId} .amount-chip.selected`).forEach(c => c.classList.remove('selected'));

function renderSummary() {
  const rate = parseFloat(document.getElementById('feeRate').value) || 4;
  const container = document.getElementById('summaryContent');

  let totalAmt = 0, totalFee = 0, totalBalance = 0;

  function mkSumCard(label, amt) {
    const fee = Math.floor(amt * rate / 100);
    const tax = Math.floor(fee * 0.1);
    const feeTotal = fee + tax;
    const balance = amt - feeTotal;
    totalAmt += amt; totalFee += feeTotal; totalBalance += balance;
    return `<div class="summary-card">
      <div class="summary-card-header">
        <span>${label}</span>
        <span style="font-size:11px;opacity:.8">${rate}%</span>
      </div>
      <table class="summary-table">
        <tr><td>① 取扱金額</td><td>${fmt(amt)}</td></tr>
        <tr><td>② 取扱手数料（${rate}%）</td><td>${fmt(fee)}</td></tr>
        <tr><td>③ 消費税（②×10%）</td><td>${fmt(tax)}</td></tr>
        <tr class="hl"><td>④ ②＋③（税込手数料）</td><td>${fmt(feeTotal)}</td></tr>
        <tr class="last-row"><td>差引振込金額</td><td>${fmt(balance)}</td></tr>
      </table>
    </div>`;
  }

  const relGroups = [
    { label: 'サニラボ→', relIds: [0,1,6,7] },
    { label: '1.2.3→',   relIds: [4,5,8] },
    { label: 'ライプラ→', relIds: [2,3] },
  ];
  let cardsHtml = '';
  relGroups.forEach(g => {
    cardsHtml += `<div class="section-divider" style="margin-top:16px">${g.label}</div><div class="summary-grid">`;
    g.relIds.forEach(rid => { cardsHtml += mkSumCard(RELS[rid].label, relTotal(rid)); });
    cardsHtml += '</div>';
  });
  cardsHtml += '<div class="section-divider" style="margin-top:16px">リミット→</div><div class="summary-grid">';
  LIMIT_GROUPS.forEach(grp => {
    const amt = grp.siteIds.reduce((s, sid) => s + getVal(sid, 'lim'), 0);
    cardsHtml += mkSumCard(`リミット → ${grp.name}`, amt);
  });
  cardsHtml += '</div>';

  const bigBar = `<div class="big-total-bar">
    <div class="big-total-item"><div class="big-total-label">取扱金額 合計</div><div class="big-total-val">${fmt(totalAmt)}</div></div>
    <div style="font-size:20px;color:var(--muted)">−</div>
    <div class="big-total-item"><div class="big-total-label">手数料（税込）合計</div><div class="big-total-val red">${fmt(totalFee)}</div></div>
    <div style="font-size:20px;color:var(--muted)">=</div>
    <div class="big-total-item"><div class="big-total-label">差引振込金額 合計</div><div class="big-total-val green">${fmt(totalBalance)}</div></div>
  </div>`;

  // Detailed breakdown table (same style as self summary)
  const billingGroups = [
    { label: 'サニラボ',  rels: [0,1,6,7] },
    { label: '1.2.3',    rels: [4,5,8] },
    { label: 'ライプラ', rels: [2,3] },
  ];
  const colHeaders = COLS.map(c => `<th>${c.label.replace('\n','<br>')}</th>`).join('');
  let grandTotal = 0;
  let tableHtml = `<div class="self-summary-card" style="border-color:var(--border)">
    <div class="self-summary-header" style="background:var(--navy)">請求サイト 決済明細</div>
    <table class="self-summary-table">
      <thead><tr><th>グループ</th><th>サイト名</th>${colHeaders}<th>合計</th></tr></thead>
      <tbody>`;

  billingGroups.forEach(grp => {
    const sites = SITES.filter(s => grp.rels.includes(s.rel));
    sites.forEach((site, i) => {
      const tot = rowTotal(site.id);
      const colCells = COLS.map(c => `<td class="num">${getVal(site.id,c.id) ? fmtN(getVal(site.id,c.id)) : ''}</td>`).join('');
      const groupCell = i === 0 ? `<td rowspan="${sites.length}" style="font-weight:700;vertical-align:middle">${grp.label}</td>` : '';
      tableHtml += `<tr>${groupCell}<td>${site.name}</td>${colCells}<td class="num" style="font-weight:700">${fmt(tot)}</td></tr>`;
    });
    const grpTot = grp.rels.reduce((s,rid) => s + relTotal(rid), 0);
    grandTotal += grpTot;
    const grpCols = COLS.map(c => {
      const sum = sites.reduce((s,st) => s + getVal(st.id,c.id), 0);
      return `<td class="num">${sum ? fmtN(sum) : ''}</td>`;
    }).join('');
    tableHtml += `<tr class="total-row"><td colspan="2">小 計（${grp.label}）</td>${grpCols}<td class="num">${fmt(grpTot)}</td></tr>`;
  });
  tableHtml += `</tbody></table></div>`;

  container.innerHTML = bigBar + cardsHtml + '<div class="section-divider" style="margin-top:24px">決済種別 明細</div>' + tableHtml;
}

// ── Tab 5: Invoices ───────────────────────────
function buildBankSection(company) {
  if (!company.banks || company.banks.length === 0) return '';
  const rows = b => `
    <tr><td>金融機関</td><td>${b.name}</td></tr>
    <tr><td>支店</td><td>${b.branch}</td></tr>
    <tr><td>預金種別</td><td>${b.type}</td></tr>
    <tr><td>口座番号</td><td>${b.no}</td></tr>
    <tr><td>口座名義</td><td>${b.holder}</td></tr>
    <tr><td>振込予定日</td><td>当月末</td></tr>`;
  if (company.banks.length === 1) {
    return `<table class="inv-bank"><caption>振 込 先 口 座</caption><tbody>${rows(company.banks[0])}</tbody></table>`;
  }
  return `<div class="inv-bank-multi">${company.banks.map(b =>
    `<table class="inv-bank"><caption>振 込 先 口 座</caption><tbody>${rows(b)}</tbody></table>`
  ).join('')}</div>`;
}

function printOne(relId) {
  document.body.classList.add('print-one');
  document.querySelectorAll('.inv-wrap').forEach(el => el.classList.remove('print-target'));
  const target = document.getElementById('inv-wrap-' + relId);
  if (target) target.classList.add('print-target');
  window.print();
  document.body.classList.remove('print-one');
}

function printAll() {
  document.body.classList.remove('print-one');
  window.print();
}

function renderInvoices() {
  const sel = document.getElementById('invSelect').value;
  const container = document.getElementById('invoiceContent');
  const isLim = sel === 'lim-all' || sel.startsWith('lim-');
  const isAll12 = sel === 'all-12';

  let html = '<div class="all-invoices">';

  if (isAll12) {
    RELS.forEach(rel => {
      if (relTotal(rel.id) === 0) return;
      html += `<div class="inv-wrap" id="inv-wrap-${rel.id}">
        <div class="inv-group-label" style="display:flex;justify-content:space-between;align-items:center">
          <span>${rel.label}</span>
          <button class="print-btn" style="font-size:11px;padding:5px 16px" onclick="printOne(${rel.id})">🖨 この1枚を印刷</button>
        </div>
        ${buildInvoice(rel.id)}
      </div>`;
    });
    LIMIT_GROUPS.forEach((grp, idx) => {
      if (grp.siteIds.reduce((s, sid) => s + getVal(sid, 'lim'), 0) === 0) return;
      const label = `リミット → ${grp.name}`;
      html += `<div class="inv-wrap" id="inv-wrap-lim-${idx}">
        <div class="inv-group-label" style="display:flex;justify-content:space-between;align-items:center">
          <span>${label}</span>
          <button class="print-btn" style="font-size:11px;padding:5px 16px" onclick="printLimOne(${idx})">🖨 この1枚を印刷</button>
        </div>
        ${buildLimInvoice(idx)}
      </div>`;
    });
    html += '</div><div style="margin-top:16px"><button class="print-btn" onclick="printAll12()">🖨 全件印刷（14枚）</button></div>';
  } else if (!isLim) {
    RELS.forEach(rel => {
      if (sel === 'all' && relTotal(rel.id) === 0) return;
      const hidden = (sel !== 'all' && sel !== String(rel.id)) ? 'style="display:none"' : '';
      html += `<div class="inv-wrap" id="inv-wrap-${rel.id}" ${hidden}>
        <div class="inv-group-label" style="display:flex;justify-content:space-between;align-items:center">
          <span>${rel.label}</span>
          <button class="print-btn" style="font-size:11px;padding:5px 16px" onclick="printOne(${rel.id})">🖨 この1枚を印刷</button>
        </div>
        ${buildInvoice(rel.id)}
      </div>`;
    });
    if (sel === 'all') {
      html += '</div><div style="margin-top:16px"><button class="print-btn" onclick="printAll()">🖨 全件印刷（9枚）</button></div>';
    } else {
      html += '</div>';
    }
  } else {
    LIMIT_GROUPS.forEach((grp, idx) => {
      const limKey = 'lim-' + idx;
      if (sel === 'lim-all' && grp.siteIds.reduce((s, sid) => s + getVal(sid, 'lim'), 0) === 0) return;
      const hidden = (sel !== 'lim-all' && sel !== limKey) ? 'style="display:none"' : '';
      const label = `リミット → ${grp.name}`;
      html += `<div class="inv-wrap" id="inv-wrap-lim-${idx}" ${hidden}>
        <div class="inv-group-label" style="display:flex;justify-content:space-between;align-items:center">
          <span>${label}</span>
          <button class="print-btn" style="font-size:11px;padding:5px 16px" onclick="printLimOne(${idx})">🖨 この1枚を印刷</button>
        </div>
        ${buildLimInvoice(idx)}
      </div>`;
    });
    html += '</div>';
    if (sel === 'lim-all') {
      html += `<div style="margin-top:16px"><button class="print-btn" onclick="printLimAll()">🖨 リミット分 全件印刷（5枚）</button></div>`;
    }
  }

  container.innerHTML = html;
}

  window.print();

function printLimAll() {
  document.body.classList.remove('print-one');
  window.print();
}

function printAll12() {
  document.body.classList.remove('print-one');

}
